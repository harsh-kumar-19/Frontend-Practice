<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <header>
        <div class="header">
            <div class="logo">TechRoz</div>
            <div class="navbar">
                <a href="#">HOME</a>
                <a href="#">ABOUT</a>
                <a href="#">SERVICE</a>
                <a href="#">DESIGN</a>
                <a href="#">CONTACT</a>
            </div>
            <div class="search">
                <input type="search" placeholder="Type to search">
                <button type="button" class="searchbox">Search</button>
            </div>
        </div>
    </header>
    <main>
        <div class="leftsection">
            <div class="top">
                <h2>Web Design & <br><span class="orange">Development</span></h2>
            </div>
            <p class="details">Welcome to the World of Frontend! <br>
                                Transform your ideas into beautiful web experiences. <br>
                                Create designs that users love and remember.</p>
            <button type="button" class="join">Join us</button>
        </div>
        <div class="rightsection">
            <button type="button" class="loginhere">Login Here</button>
            <div class="inputbox">
                <input type="text" placeholder="Enter Email Here">
            </div>
            <div class="inputpass">
                <input type="password" placeholder="Enter Password Here">
            </div>
            <button type="button" class="login">Login</button>
            <p class="account">Don't have an account?<br><a href="#">Sign up</a> here</p>
            <p class="log">Log in with</p>
            <div class="accountHandle">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-google"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>

            </div>
        </div>
    </main>
</body>

</html>
